[project]
name = "password-manager"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Sonuseek", email = "sofyaneigum@yandex.ru" }
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50.0.2",
]

[project.scripts]
password-manager = "password_manager:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]